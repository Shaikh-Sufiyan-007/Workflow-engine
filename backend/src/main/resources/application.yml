spring:
  application:
    name: workflow-engine-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: Suffi.008
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 5

app:
  jwt:
    secret: ${JWT_SECRET:9a2f8c7e1b4d6a8f3c5e2b7d9a1f4c6e8b0d2e4f6a8c1e3b5d7f9a2c4e6b8d0e}
    expiration-ms: 86400000 # 24 hours

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
