spring:
  application:
    name: workflow-engine-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  quartz:
    job-store-type: memory

app:
  jwt:
    secret: 9a2f8c7e1b4d6a8f3c5e2b7d9a1f4c6e8b0d2e4f6a8c1e3b5d7f9a2c4e6b8d0e
    expiration-ms: 3600000
